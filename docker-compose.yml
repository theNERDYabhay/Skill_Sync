services:
  postgres:
    image: postgres:16-alpine
    container_name: skillsync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsync_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-skillsync_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillsync} -d ${POSTGRES_DB:-skillsync_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillsync_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: skillsync_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillsync}:${POSTGRES_PASSWORD:-skillsync_secure_password}@postgres:5432/${POSTGRES_DB:-skillsync_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
      ML_SERVICE_URL: http://ml:8000
      JWT_SECRET: ${JWT_SECRET:-jwt_production_secret_32_characters}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: skillsync_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_VERSION: v2.4.1-hybrid-complementarity

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: skillsync_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillsync}:${POSTGRES_PASSWORD:-skillsync_secure_password}@postgres:5432/${POSTGRES_DB:-skillsync_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
